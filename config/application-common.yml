spring:
  application:
    name: flashsale-service
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

flashsale:
  trace:
    header: X-Trace-Id
  security:
    jwt-secret: ${JWT_SECRET:change-me-in-development}
