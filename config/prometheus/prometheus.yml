global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: flashsale-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway:8080
          - auth:8080
          - product:8080
          - activity:8080
          - inventory:8080
          - coupon:8080
          - order:8080
          - payment:8080
          - job:8080
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
