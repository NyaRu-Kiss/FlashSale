spring:
  application.name: flashsale-inventory
  config.import: optional:nacos:${spring.application.name}.yaml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
  cloud.nacos.discovery.server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
  cloud.nacos.config.server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
  data.redis.host: ${REDIS_HOST:redis}
  data.redis.port: ${REDIS_PORT_INTERNAL:6379}
server.port: ${SERVER_PORT:8080}
management.endpoints.web.exposure.include: health,info,prometheus
flashsale.security.jwt-secret: ${JWT_SECRET}
flashsale.security.jwt-ttl: ${JWT_TTL:PT2H}
