name: flashsale

x-observed-env: &observed-env
  NACOS_SERVER_ADDR: nacos:8848
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flashsale
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-flashsale}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-flashsale}
  REDIS_HOST: redis
  SPRING_DATA_REDIS_HOST: redis
  ROCKETMQ_NAMESRV_ADDR: rocketmq-namesrv:9876
  JWT_SECRET: ${JWT_SECRET:-local-only-jwt-secret-at-least-32-bytes}
  SW_AGENT_COLLECTOR_BACKEND_SERVICES: skywalking-oap:11800
  JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m


services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flashsale}
      POSTGRES_USER: ${POSTGRES_USER:-flashsale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flashsale}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-flashsale} -d $${POSTGRES_DB:-flashsale}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migration:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/flashsale
      FLYWAY_USER: flashsale
      FLYWAY_PASSWORD: flashsale
    volumes: ["flashsale-m2:/root/.m2"]
    command: ["mvn", "-B", "-f", "flashsale-migration/pom.xml", "compile", "exec:java"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    command: sh mqnamesrv
    ports: ["${ROCKETMQ_NAMESRV_PORT:-9876}:9876"]
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -q '[N]amesrvStartup'"]
      interval: 10s
      timeout: 5s
      retries: 20

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.3.1/conf/broker.conf
    ports: ["10909:10909", "${ROCKETMQ_BROKER_PORT:-10911}:10911"]
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -q '[B]rokerStartup'"]
      interval: 10s
      timeout: 5s
      retries: 20

  rocketmq-init:
    image: apache/rocketmq:5.3.1
    depends_on:
      - rocketmq-broker
    command: >-
      sh -c "sleep 15;
      /home/rocketmq/rocketmq-5.3.1/bin/mqadmin updateTopic -n rocketmq-namesrv:9876 -c DefaultCluster -t FLASHSALE_EVENTS || true;
      /home/rocketmq/rocketmq-5.3.1/bin/mqadmin updateTopic -n rocketmq-namesrv:9876 -c DefaultCluster -t RETRY_FLASHSALE_EVENTS || true;
      /home/rocketmq/rocketmq-5.3.1/bin/mqadmin updateTopic -n rocketmq-namesrv:9876 -c DefaultCluster -t DLQ_FLASHSALE_EVENTS || true"

  nacos:
    image: nacos/nacos-server:v2.4.3
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports: ["${NACOS_PORT:-8848}:8848", "${NACOS_GRPC_PORT:-9848}:9848"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  auth:
    profiles: ["r02", "r21"]
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: flashsale-auth
    environment:
      <<: *observed-env
      SW_AGENT_NAME: flashsale-auth
    depends_on:
      nacos:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  gateway:
    profiles: ["r02", "r21"]
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: flashsale-gateway
    environment:
      <<: *observed-env
      SW_AGENT_NAME: flashsale-gateway
    ports: ["${GATEWAY_PORT:-8080}:8080"]
    depends_on:
      nacos:
        condition: service_healthy
      auth:
        condition: service_started

  product:
    profiles: ["r21"]
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: flashsale-product
    environment:
      <<: *observed-env
      SW_AGENT_NAME: flashsale-product
    depends_on:
      nacos:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  activity:
    profiles: ["r21"]
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: flashsale-activity
    environment:
      <<: *observed-env
      SW_AGENT_NAME: flashsale-activity
    depends_on:
      nacos:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  inventory:
    profiles: ["r21"]
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: flashsale-inventory
    environment:
      <<: *observed-env
      SW_AGENT_NAME: flashsale-inventory
    depends_on:
      nacos:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  coupon:
    profiles: ["r21"]
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: flashsale-coupon
    environment:
      <<: *observed-env
      SW_AGENT_NAME: flashsale-coupon
    depends_on:
      nacos:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  order:
    profiles: ["r21"]
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: flashsale-order
    environment:
      <<: *observed-env
      SW_AGENT_NAME: flashsale-order
    depends_on:
      nacos:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  payment:
    profiles: ["r21"]
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: flashsale-payment
    environment:
      <<: *observed-env
      SW_AGENT_NAME: flashsale-payment
    depends_on:
      nacos:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  job:
    profiles: ["r21"]
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: flashsale-job
    environment:
      <<: *observed-env
      SW_AGENT_NAME: flashsale-job
    depends_on:
      nacos:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.1
    depends_on:
      xxl-mysql:
        condition: service_healthy
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://xxl-mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
        --spring.datasource.username=xxl
        --spring.datasource.password=xxl
    ports: ["${XXL_JOB_PORT:-18088}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  xxl-mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: xxl_job
      MYSQL_USER: xxl
      MYSQL_PASSWORD: xxl
      MYSQL_ROOT_PASSWORD: xxl-root
    command: ["--default-authentication-plugin=mysql_native_password"]
    volumes:
      - xxl-mysql-data:/var/lib/mysql
      - ./db/xxl-job.sql:/docker-entrypoint-initdb.d/xxl-job.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uxxl -pxxl --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: quay.io/minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flashsale}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flashsale123}
    command: server /data --console-address ":9001"
    ports: ["${MINIO_API_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  skywalking-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skywalking
      POSTGRES_USER: skywalking
      POSTGRES_PASSWORD: ${SKYWALKING_DB_PASSWORD:-skywalking-local}
    volumes: ["skywalking-postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skywalking -d skywalking"]
      interval: 5s
      timeout: 3s
      retries: 20

  skywalking-oap:
    image: apache/skywalking-oap-server:10.2.0
    environment:
      SW_STORAGE: postgresql
      SW_JDBC_URL: jdbc:postgresql://skywalking-postgres:5432/skywalking
      SW_DATA_SOURCE_USER: skywalking
      SW_DATA_SOURCE_PASSWORD: ${SKYWALKING_DB_PASSWORD:-skywalking-local}
      JAVA_OPTS: -Xms256m -Xmx512m
    ports: ["${SKYWALKING_OAP_PORT:-12800}:12800"]
    depends_on:
      skywalking-postgres:
        condition: service_healthy

  skywalking-ui:
    image: apache/skywalking-ui:10.2.0
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    ports: ["${SKYWALKING_UI_PORT:-18090}:8080"]
    depends_on: [skywalking-oap]

  promtail:
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./config/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-flashsale}:${POSTGRES_PASSWORD:-flashsale}@postgres:5432/${POSTGRES_DB:-flashsale}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro,rslave
    pid: host

  prometheus:
    image: prom/prometheus:v2.55.1
    depends_on:
      - alertmanager
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 20

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports: ["${ALERTMANAGER_PORT:-9093}:9093"]
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 20

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/config.yml"]
    ports: ["${LOKI_PORT:-3100}:3100"]
    volumes:
      - ./config/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 20

  grafana:
    image: grafana/grafana:11.3.0
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  flashsale-m2:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  alertmanager-data:
  loki-data:
  grafana-data:
  xxl-mysql-data:
  skywalking-postgres-data:
