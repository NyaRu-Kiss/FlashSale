# H03-only runtime flags. This file is used with docker-compose.yml under the
# isolated flashsale-h03 project; it does not alter the acceptance compose file.
x-h03-env: &h03-env
  FLASHSALE_OUTBOX_ENABLED: "true"
  FLASHSALE_CONSUMER_ENABLED: "true"
  XXL_JOB_ENABLED: "true"
  XXL_JOB_ACCESS_TOKEN: "default_token"

services:
  xxl-job-admin:
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://xxl-mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
        --spring.datasource.username=xxl
        --spring.datasource.password=xxl
        --xxl.job.accessToken=default_token
  xxl-mysql:
    volumes:
      - ./load/h03/xxl-job-init.sql:/docker-entrypoint-initdb.d/zz-h03.sql:ro
  auth: {environment: *h03-env}
  gateway:
    environment:
      <<: *h03-env
      # H03 data preparation and burst traffic must not be rejected by the
      # normal production Sentinel quotas. This override is isolated to H03.
      FLASHSALE_GATEWAY_RATE_LIMIT_DEFAULT_QPS: "20000"
      FLASHSALE_GATEWAY_RATE_LIMIT_IP_QPS: "20000"
      FLASHSALE_GATEWAY_RATE_LIMIT_ACTIVITY_HOTSPOT_QPS: "20000"
      FLASHSALE_GATEWAY_RATE_LIMIT_COUPON_HOTSPOT_QPS: "20000"
  product: {environment: *h03-env}
  activity: {environment: *h03-env}
  inventory: {environment: *h03-env}
  coupon: {environment: *h03-env}
  order: {environment: *h03-env}
  payment: {environment: *h03-env}
  job: {environment: *h03-env}
